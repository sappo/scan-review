#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
  proxy_pass http://127.0.0.1:__PORT__/;
  include proxy_params_no_auth;
  proxy_redirect off;

  # LAN only, in addition to SSO. Two independent layers: this keeps the
  # scans off the internet even if a permission is widened by mistake.
  # Delete these two lines to allow SSO-authenticated access from anywhere.
  allow 192.168.1.0/24;
  deny all;

  # Matches MAX_UPLOAD_BYTES in app.py. Rejecting an oversize body here means
  # it never reaches the app's temp dir on the root filesystem.
  client_max_body_size 128m;

  # Ingest runs detection and deskew inline on a full-size scan.
  proxy_read_timeout 120s;
}
