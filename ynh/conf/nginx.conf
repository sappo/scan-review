#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
  proxy_pass http://127.0.0.1:__PORT__/;
  # proxy_params, NOT proxy_params_no_auth. The "no_auth" variant exists for
  # apps that do their own authentication, and it blanks exactly the header
  # this app relies on:
  #
  #     proxy_set_header Ynh-User "";
  #
  # With it, SSOwat authenticated the operator, nginx stripped the header on
  # the way to uvicorn, and the app answered "authentication required" - after
  # a successful login, which is a confusing place to land.
  #
  # Safe because SSOwat clears every client-supplied ynh- and ynh_ header
  # unconditionally before deciding access (access.lua, "Clean all Yunohost
  # Authentication Headers"), so the header cannot be forged.
  include proxy_params;
  proxy_redirect off;

  # SSO decides WHO may log in; this decides FROM WHERE. Rendered from the
  # lan_only setting in the app's config panel - edit the setting, not this
  # file, because an app upgrade re-renders it and would revert a hand-edit.
  __LAN_ACCESS__

  # Matches MAX_UPLOAD_BYTES in app.py. Rejecting an oversize body here means
  # it never reaches the app's temp dir on the root filesystem.
  client_max_body_size 128m;

  # Ingest runs detection and deskew inline on a full-size scan.
  proxy_read_timeout 120s;
}
