version = "1.0"

[main]
name = "Scanpipe"

    [main.access]
    name = "Network access"

        [main.access.lan_only]
        ask = "Restrict to the local network"
        type = "boolean"
        yes = "1"
        no = "0"
        default = "1"
        help = """Two independent layers guard these documents: YunoHost's SSO
decides WHO may log in, and this decides FROM WHERE. Leaving it on means the
review UI is unreachable from the internet even if a permission is widened by
mistake, or the router forwards the port. Turn it off to review scans while
away from home - your YunoHost login then becomes the only thing in front of
scanned bank and medical documents."""

        [main.access.lan_subnet]
        ask = "Local network ranges"
        type = "string"
        default = "192.168.1.0/24"
        # A LIST, space or comma separated, because a home LAN is dual-stack.
        # A client that resolves this host locally may arrive over IPv4 or over
        # an IPv6 ULA, and an IPv4-only allowlist silently refuses the latter.
        pattern.regexp = '^[0-9a-fA-F:.]+/[0-9]{1,3}([ ,]+[0-9a-fA-F:.]+/[0-9]{1,3})*$'
        pattern.error = "One or more CIDR ranges, e.g. 192.168.1.0/24 fd00::/8"
        help = "Space-separated. Include your IPv6 ULA prefix too, or IPv6-preferring clients will be refused."
        visible = "lan_only == '1'"
