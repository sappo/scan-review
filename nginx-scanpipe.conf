# scanpipe review UI over TLS, LAN-only.
#
#   sudo install -m644 nginx-scanpipe.conf /etc/nginx/conf.d/scanpipe.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why this exists: HTTP basic auth sends the password on EVERY request, and the
# browser replays it for each thumbnail and image fetch. On plain HTTP any
# device holding the Wi-Fi PSK - a guest phone, a smart plug - can capture both
# the credentials and the scans themselves. This host already terminates a real
# Let's Encrypt certificate, so there is no reason to run the UI in the clear.
#
# Why port 8765 at the ROOT rather than a /scanpipe/ location on the main vhost:
# ui.html and ui.js address /api/..., /ui.js and /icons.svg absolutely. Under a
# path prefix every one of those would resolve against the vhost root and 404.
# Keeping the app at a root buys TLS without rewriting the client's URLs.
#
# The allow/deny pair preserves the LAN-only property. Without it this would be
# reachable from the internet with nothing but a password in front of banking
# and medical documents - strictly worse than the plain-HTTP setup it replaces.
# It is deliberately redundant with the nftables rule: two independent layers,
# either of which alone keeps the port off the internet.
server {
    listen 8765 ssl http2;
    listen [::]:8765 ssl http2;
    server_name scans.example.org;

    ssl_certificate     /etc/yunohost/certs/scans.example.org/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/scans.example.org/key.pem;

    # LAN only. Hairpin NAT means a LAN client reaching scans.example.org arrives
    # either as its own 192.168.1.x or as the router's 192.168.1.1; both are
    # inside this range, so the two hairpin behaviours are covered.
    allow 192.168.1.0/24;
    deny all;

    access_log /var/log/nginx/scanpipe-access.log;
    error_log  /var/log/nginx/scanpipe-error.log;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Pi pushes full-size scans to /api/ingest. Matches
        # MAX_UPLOAD_BYTES in app.py, and rejects an oversize body HERE -
        # before FastAPI spools it to /tmp, which is the root filesystem this
        # host also runs mail and PostgreSQL on.
        client_max_body_size 128m;

        # Ingest detects and deskews a FULL-size scan inline, which is not fast.
        proxy_read_timeout 120s;
    }
}
