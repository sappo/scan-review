#!/usr/sbin/nft -f
# Reach the scan review UI from inside the LAN only.
#
# This host is internet-facing (YunoHost: mail/web on 0.0.0.0 with dynamic DNS),
# and the scans contain banking and medical documents. Restricting the source to
# the local subnet means the port stays unreachable from the internet even if the
# router forwards it or UPnP opens it. HTTP basic auth guards it in addition.
#
# YunoHost only regenerates yunohost-firewall.conf, so this file survives - but
# surviving as a FILE is not the same as surviving as a POLICY. This file used
# to contribute an `accept` and nothing else, which meant the LAN-only property
# came entirely from `policy drop` in yunohost-firewall.conf: a different file,
# owned by YunoHost, that merely happens to sort after this one in the include
# glob. /etc/nftables.conf declares the input chain with no policy at all, and
# an nftables chain with no policy defaults to ACCEPT - so a yunohost-firewall
# .conf that was regenerated empty or failed to parse would open 8765, and every
# other port, to the internet. The explicit drop below makes this file stand on
# its own instead of inheriting its only guarantee from a neighbour.

table inet filter {
    chain input {
        ip saddr 192.168.1.0/24 tcp dport 8765 counter accept comment "scanpipe review UI (LAN only)"
        tcp dport 8765 counter drop comment "scanpipe: never off-LAN, whatever the chain policy"
    }
}
