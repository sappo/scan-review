#!/usr/sbin/nft -f
# Reach the scan review UI from inside the LAN only.
#
# This host is internet-facing (YunoHost: mail/web on 0.0.0.0 with dynamic DNS),
# and the scans contain banking and medical documents. Restricting the source to
# the local subnet means the port stays unreachable from the internet even if the
# router forwards it or UPnP opens it. HTTP basic auth guards it in addition.
#
# YunoHost only regenerates yunohost-firewall.conf, so this file survives.

table inet filter {
    chain input {
        ip saddr 192.168.1.0/24 tcp dport 8765 counter accept comment "scanpipe review UI (LAN only)"
    }
}
