<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Scan Review</title>
<style>
  :root { --bg:#0d0f13; --line:#2c3442; --text:#e6eaf0; --dim:#8b95a5;
          --accent:#4a9eff; --err:#f85149; --warn:#d29922;
          --float:rgba(28,33,42,0.82); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* Any class that sets `display` beats the UA stylesheet's [hidden] rule, so
     `.hidden = true` silently does nothing on .pill. State it once, globally,
     rather than remembering to guard every display-setting class. */
  [hidden] { display:none !important; }
  html,body { height:100%; margin:0; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--text); position:relative;
         font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }

  /* The canvas fills the whole screen; every control floats above it. */
  #stage { position:absolute; inset:0; }
  #cv, #grid { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #cv { touch-action:none; }
  #grid { pointer-events:none; }

  .bar { position:absolute; left:0; right:0; display:flex; align-items:center;
         gap:8px; padding:10px; pointer-events:none; flex-wrap:wrap; }
  /* space-between so that once the title wraps to its own row the two button
     clusters sit at the edges instead of bunching left with dead space. */
  #top { top:0; padding-top:calc(10px + env(safe-area-inset-top));
         justify-content:space-between; }
  /* Sits inside the nav pill, which supplies the background and the height. */
  #top .grow { min-width:0; height:44px; display:flex; align-items:center;
               gap:8px; padding:0 10px; border-radius:999px; background:transparent;
               box-shadow:none; pointer-events:auto; font-size:15px;
               color:var(--text); }
  #top .fname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; text-align:left; }
  /* Never allowed to shrink: the count was being eaten by the filename's
     ellipsis, so the one value that changes was the one you could not read. */
  #top .count { flex:none; color:var(--dim); font-size:13px;
                font-variant-numeric:tabular-nums; }

  /* Collapsed it is just the queue position, small enough to sit between the
     two button clusters. Tapping expands it onto its own row for the filename,
     which has nowhere near enough width to be legible inline on a phone. */
  #top .grow:not(.open) { flex:0 0 auto; justify-content:center; padding:0 14px; }
  #top .grow:not(.open) .fname { display:none; }
  #top .grow:not(.open) .count { color:var(--text); font-size:15px; }
  #top .grow.open { flex:1 1 auto; }
  /* Own row only where it is needed. Full width on a wide screen puts the pill
     directly over the frame's top-left corner, where it swallows the drag. */
  @media (max-width:560px) {
    #top #nav.wide { order:3; flex-basis:100%; }
  }

  /* Floating clusters, bottom-centred, clear of the safe area. */
  #controls { position:absolute; left:0; right:0;
              bottom:calc(10px + env(safe-area-inset-bottom));
              display:flex; flex-direction:column; align-items:center; gap:8px;
              pointer-events:none; }
  .pill { display:flex; gap:4px; align-items:center; padding:5px;
          background:var(--float); border-radius:999px; backdrop-filter:blur(10px);
          box-shadow:0 4px 20px rgba(0,0,0,.45); pointer-events:auto;
          max-width:calc(100vw - 24px); flex-wrap:nowrap; }
  .pill.wide { border-radius:18px; flex-wrap:wrap; justify-content:center; }
  /* The one permanently visible bar. Its buttons are narrower than the 44px
     used elsewhere: seven of them plus a separator do not fit 360px otherwise,
     and two stacked bars took too much of the page. Full 44px height is kept,
     so only the horizontal target shrinks, and the two decisions that matter -
     accept and reject - stay 44px wide in the top bar. */
  #toolbar { gap:2px; padding:5px 4px; }
  #toolbar button { width:38px; }
  .sep { flex:none; width:1px; height:24px; margin:0 5px;
         background:var(--line); border-radius:1px; }

  button.grow { border:0; font:inherit; }
  button:not(.grow) { width:44px; height:44px; padding:0; border:0; border-radius:999px;
           background:transparent; color:var(--text); display:grid;
           place-items:center; pointer-events:auto; }
  /* Also set here: <use> does not inherit presentation attributes from the
     sprite's root <svg>, and without these the icons render as filled blobs. */
  button svg { width:21px; height:21px; fill:none; stroke:currentColor;
               stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  button[aria-pressed=true] { background:var(--accent); color:#06121f; }
  button.primary { background:var(--accent); color:#06121f; }
  button.danger { color:#ffb4ad; }
  button.text { width:auto; min-width:44px; padding:0 14px; font-size:15px;
                font-weight:600; letter-spacing:.02em; }
  /* How many pages are staged for this batch's PDF. Without it you cannot tell
     what Send is about to produce until it has produced it. */
  button.counted { position:relative; }
  .badge { position:absolute; top:1px; right:1px; min-width:18px; height:18px;
           padding:0 4px; border-radius:9px; background:var(--accent);
           color:#06121f; font-size:11px; font-weight:700; line-height:18px;
           text-align:center; }
  .badge:empty { display:none; }
  button:disabled { opacity:.35; }

  #dialwrap { pointer-events:auto; background:var(--float); border-radius:26px;
              backdrop-filter:blur(10px); padding:2px 4px 0;
              box-shadow:0 4px 20px rgba(0,0,0,.45); }
  #dial { flex:1; min-width:0; height:48px; touch-action:none; display:block; }
  #panel-straighten { display:flex; flex-direction:column; align-items:center; gap:2px; }
  /* The +/- steps live in the dial row itself rather than a separate pill. */
  .dialrow { display:flex; align-items:center; gap:2px; padding:2px 4px;
             width:min(420px, calc(100vw - 24px)); }
  .readout { text-align:center; font-variant-numeric:tabular-nums;
             color:var(--dim); font-size:12px; padding-bottom:4px; }

  .flag { pointer-events:auto; margin:0; max-width:calc(100vw - 24px);
          background:rgba(58,44,12,.9); color:#ffd479; font-size:12.5px;
          padding:6px 14px; border-radius:999px; text-align:center;
          backdrop-filter:blur(8px); }
  #status { pointer-events:none; font-size:12.5px; color:var(--dim);
            min-height:0; text-align:center; }
  #status:empty { display:none; }

  /* Wide screens: the clusters move to a floating column on the right rather
     than stacking over the middle of the page. */
  @media (min-width:900px) {
    #controls { left:auto; right:14px; bottom:14px; top:auto;
                align-items:flex-end; }
    .pill.wide { flex-wrap:nowrap; }
  }
</style>

<div id="stage">
  <canvas id="cv" data-testid="canvas"></canvas>
  <canvas id="grid" data-testid="grid"></canvas>
</div>

<div class="bar" id="top">
  <div class="pill">
    <button data-testid="btn-undo" onclick="undo()" title="Undo" aria-label="Undo">
      <svg><use href="/icons.svg#undo"/></svg></button>
  </div>
  <div class="pill" id="nav">
    <button data-testid="btn-prev" onclick="step(-1)" title="Previous page"
            aria-label="Previous page"><svg><use href="/icons.svg#prev"/></svg></button>
    <button class="grow" data-testid="title-toggle" onclick="toggleTitle()"
            aria-expanded="false" title="Show page name">
      <span class="fname" data-testid="page-title">…</span>
      <span class="count" data-testid="queue-count"></span>
    </button>
    <button data-testid="btn-next" onclick="step(1)" title="Next page"
            aria-label="Next page"><svg><use href="/icons.svg#next"/></svg></button>
  </div>
  <div class="pill">
    <button class="danger" data-testid="btn-reject" onclick="reject()" title="Reject" aria-label="Reject">
      <svg><use href="/icons.svg#reject"/></svg></button>
    <button class="primary" data-testid="btn-accept" onclick="accept()" title="Accept" aria-label="Accept">
      <svg><use href="/icons.svg#accept"/></svg></button>
  </div>
</div>

<div id="controls">
  <div id="status" data-testid="status"></div>
  <p class="flag" data-testid="hint-mismatch" hidden>Panel hint disagrees with detection</p>
  <p class="flag" data-testid="outside-flag" hidden>Crop extends past the scan</p>

  <!-- Format is the one place a glyph would be worse than the label: there is
       no icon for "A4". -->
  <div class="pill wide" id="panel-crop" hidden>
    <button class="text" data-testid="fmt-A4" onclick="setFormat('A4')">A4</button>
    <button class="text" data-testid="fmt-A5" onclick="setFormat('A5')">A5</button>
    <button class="text" data-testid="fmt-A6" onclick="setFormat('A6')">A6</button>
    <button data-testid="btn-swap" onclick="swapOrientation()" title="Swap orientation" aria-label="Swap orientation">
      <svg><use href="/icons.svg#swap"/></svg></button>
    <button data-testid="btn-rotate" onclick="rotate90()" title="Rotate output 90°" aria-label="Rotate 90 degrees">
      <svg><use href="/icons.svg#rotate"/></svg></button>
  </div>

  <div id="panel-straighten" hidden>
    <div id="dialwrap">
      <div class="dialrow">
        <button data-testid="skew-minus-01" onclick="nudge(-0.1)" title="−0.1°" aria-label="Minus a tenth of a degree">
          <svg><use href="/icons.svg#minus"/></svg></button>
        <canvas id="dial" data-testid="dial"></canvas>
        <button data-testid="skew-plus-01" onclick="nudge(0.1)" title="+0.1°" aria-label="Plus a tenth of a degree">
          <svg><use href="/icons.svg#plus"/></svg></button>
      </div>
      <div class="readout"><span data-testid="angle-readout">+0.00°</span></div>
    </div>
  </div>

  <div class="pill" id="toolbar">
    <button data-testid="mode-crop" aria-pressed="true" onclick="setMode('crop')"
            title="Crop" aria-label="Crop"><svg><use href="/icons.svg#crop"/></svg></button>
    <button data-testid="mode-straighten" aria-pressed="false" onclick="setMode('straighten')"
            title="Straighten" aria-label="Straighten"><svg><use href="/icons.svg#straighten"/></svg></button>
    <span class="sep" data-testid="toolbar-sep" role="separator" aria-orientation="vertical"></span>
    <button data-testid="btn-pagesetup" aria-pressed="false" onclick="togglePageSetup()"
            title="Page size &amp; rotation" aria-label="Page size and rotation"><svg><use href="/icons.svg#pagesetup"/></svg></button>
    <button data-testid="grid-toggle" aria-pressed="true" onclick="toggleGrid()"
            title="Gridlines" aria-label="Toggle gridlines"><svg><use href="/icons.svg#grid"/></svg></button>
    <button data-testid="btn-peek" onclick="togglePeek()"
            title="Preview result" aria-label="Preview result"><svg><use href="/icons.svg#peek"/></svg></button>
    <button data-testid="btn-reset" onclick="resetFrame()"
            title="Reset to detected" aria-label="Reset to detected"><svg><use href="/icons.svg#reset"/></svg></button>
    <button class="counted" data-testid="btn-finalize" onclick="finalize()"
            title="Send to paperless" aria-label="Send to paperless"><svg><use href="/icons.svg#send"/></svg><span
            class="badge" data-testid="staged-count"></span></button>
  </div>
</div>

<script src="/ui.js"></script>
